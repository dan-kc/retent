[package]
name = "retent"
version = "0.1.0"
edition = "2024"
description = "Markdown-native incremental learning scheduler"
license = "MIT"

[dependencies]
chrono = { version = "0.4.41", features = ["clock"] }
clap = { version = "4.5.41", features = ["derive"] }
comfy-table = "8.0.0"
fsrs = "=6.6.1"
html2md = "0.2.15"
prost = "0.13.5"
regex = "1.11.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1.0.140"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
tempfile = "3.20.0"
walkdir = "2.5.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate", "zstd"] }
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
proptest = "1.7.0"
